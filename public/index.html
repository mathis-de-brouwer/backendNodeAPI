<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>
    <style>
        body { 
            font-family: Arial; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px;
        }
        .form-group { margin-bottom: 15px; }
        button { padding: 5px 10px; margin: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">User Management</a>
        <a href="news.html">News Management</a>
        <a href="api-docs.html">API Documentation</a>
    </nav>
    <h1>User Management</h1>

    <div id="addUserForm">
        <h2>Add New User</h2>
        <div class="form-group">
            <label>Name: </label>
            <input type="text" id="userName" required>
        </div>
        <div class="form-group">
            <label>Email: </label>
            <input type="email" id="userEmail" required>
        </div>
        <div class="form-group">
            <label>Password: </label>
            <input type="password" id="userPassword" required>
        </div>
        <button onclick="addUser()">Add User</button>
    </div>

    <div id="userList">
        <h2>User List</h2>
        <input type="text" id="searchTerm" placeholder="Search users...">
        <button onclick="searchUsers()">Search</button>
        <button onclick="loadUsers()">Show All</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>

    <script>
        // Load users when page loads
        loadUsers();

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                showError('Error loading users');
            }
        }

        async function addUser() {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
        
            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
        
                if (response.ok) {
                    document.getElementById('userName').value = '';
                    document.getElementById('userEmail').value = '';
                    document.getElementById('userPassword').value = '';
                    loadUsers();
                } else {
                    const error = await response.json();
                    showError(error.message);
                }
            } catch (error) {
                showError('Error adding user');
            }
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`/api/users/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadUsers();
                    }
                } catch (error) {
                    showError('Error deleting user');
                }
            }
        }

        async function searchUsers() {
            const term = document.getElementById('searchTerm').value;
            try {
                const response = await fetch(`/api/users/search?q=${term}`);
                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                showError('Error searching users');
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>
                        <button onclick="deleteUser(${user.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function showError(message) {
            const error = document.createElement('div');
            error.className = 'error';
            error.textContent = message;
            document.body.insertBefore(error, document.body.firstChild);
            setTimeout(() => error.remove(), 3000);
        }
    </script>
</body>
</html>
